[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "normform"
version = "0.1.1"
description = "[Experimental v0.1] Context-aware Norwegian morphological standardization, alternative generation, and style auditing"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Per Egil Kummervold"},
    {name = "Magnus Breder Birkenes"},
]
keywords = [
    "morphology",
    "norwegian",
    "bokmaal",
    "nynorsk",
    "nlp",
    "standardization",
    "normform",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "huggingface-hub>=0.20.0",
    "PyYAML>=6.0",
    "safetensors>=0.4.0",
    "sentencepiece>=0.1.96",
    "torch>=2.0.0",
    "transformers>=4.40.0",
]

[project.optional-dependencies]
batch = [
    "datasets>=2.0.0",
    "pyarrow>=12.0.0",
    "tqdm>=4.60.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.5.0",
]

[project.scripts]
normform = "normform.cli:main"

[project.urls]
Homepage = "https://github.com/NationalLibraryOfNorway/normform"
"Bug Reports" = "https://github.com/NationalLibraryOfNorway/normform/issues"
Source = "https://github.com/NationalLibraryOfNorway/normform"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["normform*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
